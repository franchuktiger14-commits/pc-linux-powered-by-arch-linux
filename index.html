var buf=[];
function add(s){buf.push(s);O.innerHTML=buf.join("\n");O.scrollTop=O.scrollHeight}
function print(s){if(s===null||s===undefined)return;if(typeof s==="string")add(s.replace(/\n/g,"<br>"));else add(String(s))}

function run(raw){
  var v=raw.trim();
  if(!v)return;
  hist.push(v);hi=hist.length;
  add(prompt()+v);
  var parts=v.split(/\s+/);
  var c=parts[0];var a=parts.slice(1);
  var fn=CMD[c];
  if(fn){var res=fn(a);if(c==="clear"){buf=[];O.innerHTML="";return}print(res)}
  else{print('<span style="'+R+'">zsh: команда не найдена: '+c+'</span>\n\n'+allCmds)}
}

function tabComplete(){
  var v=I.value;var parts=v.split(" ");
  if(parts.length===1){
    var m=Object.keys(CMD).filter(function(k){return k.startsWith(parts[0].toLowerCase())});
    if(m.length===1)I.value=m[0]+" ";
    else if(m.length>1)add('<span style="'+D+'">'+m.join("  ")+"</span>")
  }else if(parts.length===2){
    var d=getDir(cwd)||{};var k=Object.keys(d).filter(function(x){return x.startsWith(parts[1])});
    if(k.length===1)I.value=parts[0]+" "+k[0]+" "
  }
}

I.addEventListener("keydown",function(e){
  if(e.key==="Enter"){e.preventDefault();run(I.value);I.value=""}
  else if(e.key==="Tab"){e.preventDefault();tabComplete()}
  else if(e.key==="ArrowUp"){e.preventDefault();if(hi>0){hi--;I.value=hist[hi]||""}}
  else if(e.key==="ArrowDown"){e.preventDefault();if(hi<hist.length-1){hi++;I.value=hist[hi]||""}else{hi=hist.length;I.value=""}}
});
